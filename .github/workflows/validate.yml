name: Validate filter lists

on:
  pull_request:
    paths:
      - "**.json"
      - "scripts/validate.js"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "**.json"
      - "scripts/validate.js"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate.js
